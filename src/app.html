<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<!-- The manifest carries one static colour (the splash paints before any CSS
		     exists). These follow the OS instead, for the installed window chrome.
		     Safari 26+ ignores them and samples the body background, which already
		     follows the theme. -->
		<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Folio" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

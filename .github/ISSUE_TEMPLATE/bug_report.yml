name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Regeste is a privacy-first product: **never paste document content,
        passages, filenames or personal data into an issue.** Reproduce with a
        public sample document if you can, or describe the shape of the data
        without its content.
  - type: dropdown
    id: mode
    attributes:
      label: Answer mode
      description: Which trust boundary were you using?
      options:
        - Private (on-device model)
        - Assisted (Cloudflare Worker)
        - My AI (own endpoint)
        - Not relevant / before answering
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or URL
      description: Where does the bug appear? (e.g. /chat, /chat/documents, a chat link)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shorter, the better. Include the document format (PDF, DOCX, MD, TXT) without its content.
      placeholder: |
        1. Open /chat and add a PDF
        2. Ask …
        3. …
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and whether the model was downloaded on this device.
      placeholder: Chrome 138 on macOS 15, Private model downloaded
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have not included any document content or personal data in this issue.
          required: true

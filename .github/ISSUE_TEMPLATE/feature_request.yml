name: Feature request
description: An idea for Regeste.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem to solve?
      description: The need, not the solution. One or two sentences.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed approach
      description: How could Regeste solve it? Sketching is fine.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or think of?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have not included any document content or personal data in this request.
          required: true
        - label: I searched for an existing issue covering this.
          required: true

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# One run per branch/PR at a time; a newer commit cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

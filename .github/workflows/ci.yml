name: CI

on:
  push:
    # `main` is covered by the Release workflow, which runs the same reusable
    # verify job before releasing. Listing it here too ran the whole gate twice
    # per merge, in two concurrency groups that could not cancel each other.
    branches: [develop]
  pull_request:

# One run per branch/PR at a time; a newer commit cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # semantic-release derives the next version from commit subjects, so a
  # malformed one does not just read badly: it drops the change from the
  # changelog, or ships a release nobody asked for. Only the commits the pull
  # request adds are linted — rewriting published history to satisfy a linter
  # is worse than the typo it would fix.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit SHA (OpenSSF Scorecard): tags move, history does not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base..head range has to exist locally for commitlint to walk it.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - name: Lint the commits this pull request adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Squash merge writes the PR title as the commit subject that lands on
  # develop (squash_merge_commit_title: PR_TITLE), and that subject is what
  # semantic-release reads once the release PR reaches main. The job above
  # cannot see it: it lints the branch commits, which the squash discards.
  # Same config as the commit lint, so there is exactly one vocabulary.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit SHA (OpenSSF Scorecard): tags move, history does not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - name: Lint the pull request title
        env:
          # Never interpolate the title into the script: it is attacker-
          # controlled input on a public repo, and env is the safe channel.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint --verbose

  # The pre-public audit found real personal data in the private-phase fixtures
  # and history, and the history was rewritten to remove it. This gate keeps it
  # out: gitleaks scans the full history with the repo's own PII rules
  # (.gitleaks.toml) on top of the default secret rules. Fixture data must be
  # invented; the fictional values the corpus uses are allowlisted there.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit SHA (OpenSSF Scorecard): tags move, history does not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan target is the whole history, not the checkout.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact --verbose .

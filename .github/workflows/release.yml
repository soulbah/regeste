name: Release

# semantic-release: analyze commits since the last tag, bump the version,
# write CHANGELOG.md, tag vX.Y.Z and publish the GitHub Release, then hand the
# new tag to the Deploy workflow. The version bump commit carries [skip ci] so
# it does not re-trigger this workflow.
#
# Deploy is dispatched from here rather than listening for `release: published`.
# A release published with GITHUB_TOKEN raises no event that can start another
# workflow, so `on: release` never fired and nothing ever shipped (verified: a
# single Deploy run exists, and it was manual). workflow_dispatch is the one
# trigger GitHub exempts from that rule, so this is the path that works without
# introducing a second set of credentials.
on:
  push:
    branches: [main]

# One release at a time; never cancel a running release for a newer commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Required to dispatch the Deploy workflow below.
  actions: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Pinned by commit SHA (OpenSSF Scorecard): tags move, history does not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release reads the tag history to decide the next version.
          # It can unshallow a depth-1 clone itself, but only as a fallback;
          # asking for the full history keeps that off the critical path.
          fetch-depth: 0
          # semantic-release pushes the version-bump commit back to main, and
          # the main ruleset refuses pushes that do not come from the release
          # deploy key (its one bypass actor). Checking out with the key
          # rewrites origin to SSH, so the push authenticates as that actor;
          # GITHUB_TOKEN below stays for the GitHub Release API only.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.22
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - id: release
        name: Run semantic-release
        run: |
          before="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          bun run release
          after="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ "$before" != "$after" ] && [ -n "$after" ]; then
            echo "tag=$after" >> "$GITHUB_OUTPUT"
            echo "Released $after"
          else
            echo "No release produced (no qualifying commits)."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only when a new tag exists. A docs-only merge releases nothing and must
      # not redeploy production.
      - if: steps.release.outputs.tag != ''
        name: Deploy the new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ steps.release.outputs.tag }}"

  # semantic-release writes CHANGELOG.md and package.json on `main` only, so
  # without this step `develop` drifts one commit behind on every release and
  # the next merge re-proposes the same changelog. The merge carries no code:
  # it was verified on main before the release, so it does not need CI again
  # — hence [skip ci] below, because a deploy-key push (unlike GITHUB_TOKEN)
  # would otherwise start one.
  backmerge:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Pinned by commit SHA (OpenSSF Scorecard): tags move, history does not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          # Same bypass as the release job: the develop ruleset refuses direct
          # pushes except from the release deploy key.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Merge the release commit back into develop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A conflict here means main and develop disagree about a file the
          # release touched. Stop rather than guess: a failed job on an already
          # shipped release is the honest signal that a manual merge is due.
          if ! git merge --no-ff origin/main -m 'chore: back-merge the release commit into develop [skip ci]'; then
            echo "::error::Back-merge conflicted. Resolve it locally: git checkout develop && git merge origin/main"
            exit 1
          fi
          git push origin develop

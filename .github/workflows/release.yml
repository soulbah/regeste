name: Release

# semantic-release: analyze commits since the last tag, bump the version,
# write CHANGELOG.md, tag vX.Y.Z and publish the GitHub Release. The version
# bump commit carries [skip ci] so it does not re-trigger this workflow.
on:
  push:
    branches: [main]

# One release at a time; never cancel a running release for a newer commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit SHA (OpenSSF Scorecard): tags move, history does not.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # semantic-release pushes the version-bump commit back to main.
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.22
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

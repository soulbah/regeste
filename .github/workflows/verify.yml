name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to verify. Defaults to the caller's ref.
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned by commit SHA (OpenSSF Scorecard): tags move, history does not.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Empty means "the ref that triggered this run", which is what every
          # caller but the release deploy wants.
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.22
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          # Without a fallback every lockfile change re-downloads Chromium from
          # scratch; a stale browser build is still a valid starting point.
          restore-keys: |
            playwright-${{ runner.os }}-
      # The vitest browser project drives a real Chromium.
      - run: bunx playwright install chromium --with-deps
      # check + lint + test + build (asset size and CSP checks are part of build).
      - run: bun run verify
      - run: bun run knip

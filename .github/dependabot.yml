version: 2
updates:
  # `bun`, not `npm`: the npm updater bumps package.json but leaves bun.lock
  # untouched roughly one time out of two (dependabot-core#11602), and CI runs
  # `bun install --frozen-lockfile`, so those PRs land red and need a manual
  # lockfile commit. The bun updater has been GA since February 2025.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps are reviewed manually after the release window (typescript,
    # vitest, svelte…). sqlite-vec-wasm-demo also needs a manual vendor pass,
    # so it is ignored entirely here.
    ignore:
      - dependency-name: 'sqlite-vec-wasm-demo'
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major bumps are NOT ignored here, unlike npm. A GitHub Action's major
    # version is how it ships its runner migrations: wrangler-action stayed on
    # `using: node20` until v4.0.0, so ignoring majors left the deploy running
    # on a runtime GitHub had already deprecated, with no PR to say so.
